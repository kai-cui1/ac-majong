# H5 网页发布路线：单机部署（VPS/内网穿透机）—— MySQL + Redis + WS 网关 + H5 静态站
# 用法（仓库根目录）：
#   1) Cocos 构建 web-mobile（产物 client/ac-majong/build/web-mobile）
#   2) docker compose -f deploy/docker-compose.prod.yml up -d --build
#   3) 朋友访问 http://<服务器IP>:8081 即玩（WS 走 8080，客户端已自适应同主机）
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ac_majong
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ac_prod_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - ac_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      IDENTITY: account     # H5 路线：账号密码 + 会话令牌（users.pass_hash + Redis sess）
      AUTO_BOTS: 3          # 房间不满时补 Bot；纯真人局改 0
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/ac_majong
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ../client/ac-majong/build/web-mobile:/usr/share/nginx/html:ro
    depends_on:
      - server

volumes:
  ac_prod_mysql:
  ac_prod_redis:
