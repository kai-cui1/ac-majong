<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AC 麻将俱乐部 — 登录（横屏 844×390）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============================================
       横屏登录 v2（BL-019）：基准 844×390，居中纵列（对齐客户端 LoginScreen）
       ============================================ */
    .ls-page { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
      background:
        radial-gradient(ellipse at center, rgba(30, 100, 60, 0.25) 0%, transparent 60%),
        repeating-linear-gradient(45deg, var(--color-bg-table) 0px, var(--color-bg-table) 2px, var(--color-bg-table-dark) 2px, var(--color-bg-table-dark) 4px); }
    @media (orientation: portrait) {
      .ls-page::before { content: '📱 请横屏手机以获得最佳体验'; position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.85); color: var(--color-gold); font-size: 18px; z-index: 9999; font-weight: 600; }
    }
    .ls-stage { position: absolute; left: 50%; top: 50%; width: 844px; height: 390px; transform-origin: center; }
    .lg-col { position: absolute; left: 50%; top: 0; width: 480px; height: 390px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; }
    .lg-logo { margin-top: 14px; width: 56px; height: 56px; border-radius: 14px; border: 2px solid var(--color-gold-light);
      background: linear-gradient(145deg, #d4a537 0%, #a07d1c 50%, #8b6820 100%);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      box-shadow: 0 6px 24px rgba(212,165,55,0.35), inset 0 2px 0 rgba(255,255,255,0.2); }
    .lg-title { margin-top: 6px; font-size: 26px; font-weight: 900; color: var(--color-gold); letter-spacing: 6px;
      text-shadow: 0 2px 12px rgba(212,165,55,0.25); }
    .lg-sub { font-size: 11px; color: var(--color-text-muted); letter-spacing: 2px; margin-top: 2px; }
    .lg-input { width: 320px; margin-top: 10px; padding: 9px 12px; text-align: center; font-size: 13px;
      color: var(--color-text-primary); background: rgba(0,0,0,0.35); border: 1px solid rgba(212,165,55,0.25);
      border-radius: var(--radius-md); outline: none; font-family: var(--font-cn); }
    .lg-input::placeholder { color: var(--color-text-muted); }
    .lg-input:focus { border-color: var(--color-gold); box-shadow: 0 0 12px rgba(212,165,55,0.15); }
    .lg-btn { margin-top: 12px; width: 240px; padding: 9px 0; text-align: center; cursor: pointer;
      background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
      color: var(--color-bg-wood-dark); border: 1px solid var(--color-gold-light); border-radius: var(--radius-full);
      font-size: 15px; font-weight: 700; letter-spacing: 3px; font-family: var(--font-cn);
      box-shadow: 0 3px 12px rgba(212,165,55,0.3); text-decoration: none; display: block; }
    .lg-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(212,165,55,0.45); }
    .lg-status { margin-top: 6px; font-size: 10px; color: var(--color-text-secondary); min-height: 14px; }
    .lg-agree { margin-top: 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .lg-check { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(212,165,55,0.4);
      background: linear-gradient(135deg, rgba(212,165,55,0.5), rgba(212,165,55,0.3));
      display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--color-gold-light); }
    .lg-agree-txt { font-size: 9.5px; color: var(--color-text-muted); }
    .lg-agree-txt a { color: var(--color-gold); text-decoration: none; }
    .lg-notice { margin-top: 6px; font-size: 9px; color: var(--color-text-muted); text-align: center; line-height: 1.5; }
    .lg-ver { position: absolute; right: 24px; bottom: 12px; font-size: 9px; color: var(--color-text-muted); font-family: var(--font-mono); }
  </style>
</head>
<body>
  <div class="ls-page">
    <div class="ls-stage" id="stage">
      <div class="lg-col">
        <div class="lg-logo">🀄</div>
        <div class="lg-title">AC 麻将俱乐部</div>
        <div class="lg-sub">传统台式麻将 · 好友组局</div>
        <input class="lg-input" placeholder="账号（3-20 位字母/数字/下划线）" value="kaicui">
        <input class="lg-input" type="password" placeholder="密码（6-64 位）" value="........">
        <a class="lg-btn" href="home.html">登录 / 注册</a>
        <div class="lg-status"></div>
        <div class="lg-agree">
          <span class="lg-check">✓</span>
          <span class="lg-agree-txt">我已阅读并同意 <a>《用户协议》</a><a>《隐私政策》</a>，并确认已年满 18 周岁</span>
        </div>
        <div class="lg-notice">本游戏内积分均为虚拟积分，不可兑换、不可提现。适度游戏益脑，沉迷游戏伤身。</div>
      </div>
      <div class="lg-ver">v0.1.0 · 内测版</div>
    </div>
  </div>
  <script>
    const fit = () => {
      const s = Math.min(window.innerWidth / 844, window.innerHeight / 390);
      document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
    };
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
