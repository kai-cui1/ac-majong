<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AC 麻将俱乐部 — 房间等待（横屏 844×390）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============================================
       横屏房间等待页 v2（BL-019）：基准 844×390（对齐客户端 RoomScreen）
       左=房号卡/分享/加 Bot；右=2×2 座位 + 开始/状态
       ============================================ */
    .ls-page { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
      background:
        radial-gradient(ellipse at center, rgba(30, 100, 60, 0.25) 0%, transparent 60%),
        repeating-linear-gradient(45deg, var(--color-bg-table) 0px, var(--color-bg-table) 2px, var(--color-bg-table-dark) 2px, var(--color-bg-table-dark) 4px); }
    @media (orientation: portrait) {
      .ls-page::before { content: '📱 请横屏手机以获得最佳体验'; position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.85); color: var(--color-gold); font-size: 18px; z-index: 9999; font-weight: 600; }
    }
    .ls-stage { position: absolute; left: 50%; top: 50%; width: 844px; height: 390px; transform-origin: center; }
    .rm-back { position: absolute; left: 24px; top: 14px; height: 28px; padding: 0 12px; border-radius: var(--radius-full);
      background: rgba(0,0,0,0.25); border: 1px solid rgba(212,165,55,0.15); color: var(--color-text-muted);
      font-size: 11px; display: flex; align-items: center; cursor: pointer; }
    .rm-title { position: absolute; left: 0; right: 0; top: 16px; text-align: center; font-size: 17px; font-weight: 700;
      color: var(--color-gold); letter-spacing: 3px; }
    /* 左列房号卡 */
    .rm-card { position: absolute; left: 24px; top: 56px; width: 276px; height: 176px;
      background: var(--color-bg-card); border: 1px solid rgba(212,165,55,0.2); border-radius: var(--radius-lg);
      display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
    .rm-card-label { font-size: 10px; color: var(--color-text-muted); letter-spacing: 2px; }
    .rm-card-num { margin-top: 2px; font-size: 30px; font-weight: 900; color: var(--color-gold-light);
      font-family: var(--font-mono); letter-spacing: 6px; text-shadow: 0 2px 10px rgba(212,165,55,0.3); }
    .rm-copy { margin-top: 2px; padding: 3px 12px; border-radius: var(--radius-full); cursor: pointer;
      background: rgba(212,165,55,0.12); border: 1px solid rgba(212,165,55,0.3); color: var(--color-gold); font-size: 10px; }
    .rm-line { width: 240px; height: 1px; background: rgba(212,165,55,0.15); margin: 8px 0 6px; }
    .rm-meta { display: flex; gap: 26px; font-size: 11px; color: var(--color-text-secondary); }
    .rm-meta b { color: var(--color-gold-light); font-weight: 700; }
    .rm-play { margin-top: 6px; font-size: 9px; color: var(--color-text-muted); text-align: center; line-height: 1.5; }
    .rm-btn { position: absolute; left: 24px; width: 276px; height: 36px; border-radius: var(--radius-md); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; font-family: var(--font-cn); }
    .rm-share { top: 242px; background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
      color: var(--color-bg-wood-dark); border: 1px solid var(--color-gold-light); box-shadow: 0 3px 10px rgba(212,165,55,0.25); }
    .rm-addbot { top: 286px; background: rgba(0,0,0,0.25); border: 1px solid rgba(212,165,55,0.2); color: var(--color-text-secondary); }
    .rm-addbot:hover { border-color: rgba(212,165,55,0.4); color: var(--color-text-primary); }
    /* 右列座位 */
    .rm-seat-title { position: absolute; left: 365px; top: 60px; font-size: 13px; font-weight: 700; color: var(--color-text-primary); letter-spacing: 1px; }
    .rm-seat-count { position: absolute; right: 24px; top: 62px; font-size: 11px; color: var(--color-text-muted); font-family: var(--font-mono); }
    .rm-seat { position: absolute; width: 200px; height: 88px; border-radius: var(--radius-lg);
      background: var(--color-bg-card); border: 1px solid rgba(212,165,55,0.18);
      display: flex; align-items: center; gap: 10px; padding: 0 12px; }
    .rm-seat.empty { border-style: dashed; border-color: rgba(212,165,55,0.25); background: rgba(0,0,0,0.18); }
    .rm-avatar { width: 44px; height: 44px; border-radius: 50%; flex: none; position: relative;
      background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
      display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: var(--color-bg-wood-dark);
      border: 2px solid var(--color-gold-light); }
    .rm-avatar.bot { background: linear-gradient(135deg, #6b7280, #4b5563); border-color: #9ca3af; }
    .rm-online { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%;
      background: #4ade80; border: 2px solid var(--color-bg-wood-dark); }
    .rm-seat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .rm-seat-name { font-size: 13px; font-weight: 700; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rm-tags { display: flex; gap: 5px; }
    .rm-tag { font-size: 8.5px; padding: 1px 6px; border-radius: var(--radius-full); border: 1px solid; }
    .rm-tag.host { color: var(--color-gold-light); border-color: rgba(212,165,55,0.5); background: rgba(212,165,55,0.12); }
    .rm-tag.me { color: #9fe9b0; border-color: rgba(159,233,176,0.4); background: rgba(159,233,176,0.08); }
    .rm-tag.bot { color: #d1d5db; border-color: rgba(209,213,219,0.35); background: rgba(209,213,219,0.08); }
    .rm-seat-plus { width: 44px; height: 44px; border-radius: 50%; flex: none; border: 1px dashed rgba(212,165,55,0.35);
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--color-text-muted); }
    .rm-seat-empty-txt { font-size: 11px; color: var(--color-text-muted); }
    .rm-start { position: absolute; left: 465px; top: 288px; width: 220px; height: 40px; border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; letter-spacing: 3px; font-family: var(--font-cn);
      background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
      color: var(--color-bg-wood-dark); border: 1px solid var(--color-gold-light); box-shadow: 0 3px 12px rgba(212,165,55,0.3); cursor: pointer; }
    .rm-start[disabled] { background: rgba(255,255,255,0.08); color: var(--color-text-muted); border-color: rgba(255,255,255,0.12); box-shadow: none; cursor: not-allowed; }
    .rm-status { position: absolute; left: 0; right: 0; top: 340px; text-align: center; font-size: 10px; color: var(--color-text-muted); }
  </style>
</head>
<body>
  <div class="ls-page">
    <div class="ls-stage" id="stage">
      <div class="rm-back" onclick="location.href='home.html'">← 退出</div>
      <div class="rm-title">房间等待</div>

      <!-- 左列：房号卡 + 分享 + 加 Bot -->
      <div class="rm-card">
        <div class="rm-card-label">房 间 号</div>
        <div class="rm-card-num">132702</div>
        <div class="rm-copy">复制</div>
        <div class="rm-line"></div>
        <div class="rm-meta"><span>局数 <b>8 局</b></span><span>底 <b>1 台 = 1 积分</b></span></div>
        <div class="rm-play">物理牌墙展示 · 摸牌位骰 开<br>选位仪式（掷骰→选座→定首庄）恒开启</div>
      </div>
      <div class="rm-btn rm-share">📤 微信分享房号</div>
      <div class="rm-btn rm-addbot">🤖 添加机器人（1/3）</div>

      <!-- 右列：2×2 座位 -->
      <div class="rm-seat-title">座位</div>
      <div class="rm-seat-count">2/4 已入座</div>
      <div class="rm-seat" style="left:365px; top:84px;">
        <div class="rm-avatar">凯<span class="rm-online"></span></div>
        <div class="rm-seat-info">
          <span class="rm-seat-name">牌友凯叔</span>
          <span class="rm-tags"><span class="rm-tag host">👑 房主</span><span class="rm-tag me">我</span></span>
        </div>
      </div>
      <div class="rm-seat" style="left:575px; top:84px;">
        <div class="rm-avatar bot">机<span class="rm-online"></span></div>
        <div class="rm-seat-info">
          <span class="rm-seat-name">机器人1</span>
          <span class="rm-tags"><span class="rm-tag bot">Bot · 保守代打</span></span>
        </div>
      </div>
      <div class="rm-seat empty" style="left:365px; top:180px;">
        <div class="rm-seat-plus">＋</div>
        <span class="rm-seat-empty-txt">等待加入…</span>
      </div>
      <div class="rm-seat empty" style="left:575px; top:180px;">
        <div class="rm-seat-plus">＋</div>
        <span class="rm-seat-empty-txt">等待加入…</span>
      </div>

      <div class="rm-start" disabled>开始</div>
      <div class="rm-status">等待更多玩家或添加机器人（满 4 人可开始）</div>
    </div>
  </div>
  <script>
    const fit = () => {
      const s = Math.min(window.innerWidth / 844, window.innerHeight / 390);
      document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
    };
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
