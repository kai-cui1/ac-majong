<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AC 麻将俱乐部 — 我的</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-page { padding-bottom: calc(var(--tab-height) + 20px); }

    /* 个人信息头部 */
    .profile-hero {
      display: flex; flex-direction: column; align-items: center;
      padding: var(--spacing-xxl) var(--spacing-lg) var(--spacing-xl);
      background:
        radial-gradient(ellipse at top center, rgba(212,165,55,0.08) 0%, transparent 60%),
        linear-gradient(to bottom, var(--color-bg-wood), transparent);
    }
    .profile-avatar-large {
      width: 82px; height: 82px; border-radius: 50%;
      background: linear-gradient(145deg, var(--color-gold), var(--color-gold-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; border: 3px solid var(--color-gold-light);
      box-shadow: 0 6px 24px rgba(212,165,55,0.3);
      margin-bottom: var(--spacing-md);
      position: relative;
    }
    .profile-avatar-large::after {
      content: '✓';
      position: absolute; bottom: 2px; right: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--color-success); color: white;
      font-size: 10px; display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--color-bg-table);
    }
    .profile-name-large { font-size: 20px; font-weight: 700; color: var(--color-text-primary); }
    .profile-id-text { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }

    /* 统计卡片 */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-md); margin: 0 var(--spacing-lg) var(--spacing-xl);
    }
    .stat-card {
      background: var(--color-bg-card);
      border: 1px solid rgba(212,165,55,0.1);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md) var(--spacing-sm);
      text-align: center;
    }
    .stat-value { font-size: 22px; font-weight: 900; color: var(--color-gold); font-family: var(--font-mono); line-height: 1.2; }
    .stat-label { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }

    /* 菜单列表 */
    .menu-section { margin-bottom: var(--spacing-sm); }
    .menu-section-title {
      font-size: 12px; color: var(--color-text-muted); text-transform: uppercase;
      letter-spacing: 2px; padding: var(--spacing-lg) var(--spacing-lg) var(--spacing-sm);
    }
    .menu-list { margin: 0 var(--spacing-lg); }
    .menu-item {
      display: flex; align-items: center; gap: var(--spacing-md);
      padding: var(--spacing-md) var(--spacing-lg);
      background: var(--color-bg-card);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; transition: background var(--transition-fast);
      text-decoration: none; color: inherit;
    }
    .menu-item:first-child { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    .menu-item:last-child { border-radius: 0 0 var(--radius-lg) var(--radius-lg); border-bottom: none; }
    .menu-item:only-of-type { border-radius: var(--radius-lg); }
    .menu-item:hover { background: linear-gradient(135deg, rgba(212,165,55,0.06), transparent); }
    .menu-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      background: linear-gradient(135deg, rgba(212,165,55,0.12), rgba(212,165,55,0.03));
    }
    .menu-text { flex: 1; font-size: 15px; color: var(--color-text-primary); font-weight: 500; }
    .menu-arrow { color: var(--color-text-muted); font-size: 14px; }
    .menu-badge-new {
      background: var(--color-danger); color: white;
      font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 600;
    }
    .menu-badge-tag {
      background: rgba(212,165,55,0.15); color: var(--color-gold);
      font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600;
    }
    .menu-subtext { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; }

    /* 版本信息 */
    .version-footer {
      text-align: center; padding: var(--spacing-xxl) var(--spacing-lg) var(--spacing-lg);
      color: var(--color-text-muted); font-size: 11px;
    }
    .version-footer .logo-small { font-size: 18px; margin-bottom: 4px; opacity: 0.4; }
    .version-footer .ver { color: var(--color-text-muted); }
    .version-footer .copyright { margin-top: 4px; opacity: 0.5; }

    /* 分割线 */
    .divider-h { height: 1px; background: linear-gradient(to right, transparent, rgba(212,165,55,0.1), transparent); margin: var(--spacing-lg) 0; }
  </style>
</head>
<body class="bg-table">

    <!-- 版本信息 -->

  </div>

  </nav>
</body>
