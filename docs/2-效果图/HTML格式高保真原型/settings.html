<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AC 麻将俱乐部 — 设置（横屏弹层 844×390）</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ============================================
       横屏设置弹层 v2（BL-019）：大厅/牌桌共用弹层形态（对齐客户端 SettingsModal 320 宽）
       ============================================ */
    .ls-page { position: relative; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
      background:
        radial-gradient(ellipse at center, rgba(30, 100, 60, 0.25) 0%, transparent 60%),
        repeating-linear-gradient(45deg, var(--color-bg-table) 0px, var(--color-bg-table) 2px, var(--color-bg-table-dark) 2px, var(--color-bg-table-dark) 4px); }
    @media (orientation: portrait) {
      .ls-page::before { content: '📱 请横屏手机以获得最佳体验'; position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.85); color: var(--color-gold); font-size: 18px; z-index: 9999; font-weight: 600; }
    }
    .ls-stage { position: absolute; left: 50%; top: 50%; width: 844px; height: 390px; transform-origin: center; }
    .ls-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); }
    .st-panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 320px; height: 326px;
      background: linear-gradient(160deg, var(--color-bg-wood) 0%, var(--color-bg-wood-dark) 100%);
      border: 1px solid var(--color-gold-dark); border-radius: var(--radius-xl);
      box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 24px rgba(212,165,55,0.12);
      padding: 12px 18px; display: flex; flex-direction: column; align-items: center; }
    .st-title { font-size: 15px; font-weight: 700; color: var(--color-gold); letter-spacing: 2px; }
    .st-close { position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.06); border: none; color: var(--color-text-muted); font-size: 13px; cursor: pointer; }
    .st-row { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .st-label { font-size: 12px; color: var(--color-text-secondary); }
    .st-btn { padding: 6px 16px; border-radius: var(--radius-full); cursor: pointer; font-size: 11px; font-weight: 600;
      background: rgba(212,165,55,0.12); border: 1px solid rgba(212,165,55,0.35); color: var(--color-gold); font-family: var(--font-cn); }
    .st-btn.action { width: 240px; text-align: center; background: rgba(0,0,0,0.25); border-color: rgba(212,165,55,0.2);
      color: var(--color-text-secondary); margin-top: 10px; }
    .st-btn.action:hover { border-color: rgba(212,165,55,0.45); color: var(--color-text-primary); }
    .st-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; }
    .st-agree { padding: 3px 10px; border-radius: var(--radius-full); background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12); color: var(--color-text-muted); font-size: 10px; cursor: pointer; }
    .st-ver { font-size: 9px; color: var(--color-text-muted); font-family: var(--font-mono); }
    /* BL-031 P1：断线托管打法预设（玩家个人，掉线代打所用风格） */
    .st-pills { display: flex; gap: 5px; }
    .st-pill { padding: 4px 9px; border-radius: var(--radius-full); font-size: 10px; cursor: pointer;
      border: 1px solid rgba(212,165,55,0.25); color: var(--color-text-secondary); }
    .st-pill.sel { background: rgba(212,165,55,0.15); border-color: var(--color-gold-light); color: var(--color-gold-light); font-weight: 700; }
    .st-pill.lock { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="ls-page">
    <div class="ls-stage" id="stage">
      <div class="ls-dim"></div>
      <div class="st-panel">
        <button class="st-close" onclick="location.href='home.html'">✕</button>
        <div class="st-title">⚙ 设置</div>
        <div class="st-row">
          <span class="st-label">音效</span>
          <button class="st-btn">🔊 已开启</button>
        </div>
        <!-- BL-031 P1：托管打法预设（FR-AI-04/10）：玩家可选掉线代打风格，默认保守 -->
        <div class="st-row">
          <span class="st-label">断线托管打法<span style="display:block;font-size:8.5px;color:var(--color-text-muted);">掉线代打所用风格</span></span>
          <span class="st-pills">
            <span class="st-pill sel">保守</span><span class="st-pill">新手</span><span class="st-pill">最大概率</span>
          </span>
        </div>
        <div class="st-row">
          <span class="st-label">退出房间<span style="display:block;font-size:8.5px;color:var(--color-text-muted);">对局中退出＝离线托管流程</span></span>
          <button class="st-btn">退出</button>
        </div>
        <button class="st-btn action">返回登录</button>
        <!-- BL-023：玩家侧诊断包出口（报错/卡顿时复制上下文+消息环）；点击后短暂回显「已复制诊断包 ✓」 -->
        <button class="st-btn action" onclick="this.textContent='已复制诊断包 ✓';setTimeout(()=>this.textContent='复制诊断包',2000)">复制诊断包</button>
        <div class="st-foot">
          <button class="st-agree">协议/隐私</button>
          <span class="st-ver">AC Mahjong Club v0.1.0</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    const fit = () => {
      const s = Math.min(window.innerWidth / 844, window.innerHeight / 390);
      document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
    };
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
